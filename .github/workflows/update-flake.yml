name: Update Flake Inputs
on:
  workflow_dispatch:
  schedule:
    # Run weekly on Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes pipe-operators
      # No store cache here: this job only rewrites flake.lock, it builds nothing.
      - name: Update flake inputs
        run: nix flake update
      # NOTE: PRs opened with the default GITHUB_TOKEN do not trigger workflow
      # runs. Set a PAT as the FLAKE_UPDATE_TOKEN secret so the update PR gets
      # checked by build/lint/format.
      - name: Open pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.FLAKE_UPDATE_TOKEN || secrets.GITHUB_TOKEN }}
          branch: update-flake-lock
          delete-branch: true
          title: "chore(deps): update flake inputs"
          commit-message: "chore(deps): update flake.lock"
          labels: |
            dependencies
            automated
